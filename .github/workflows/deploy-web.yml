# Sitenin yayını (Cloudflare Pages, doğrudan yükleme; proje `ainotepad`, üretim dalı `main`):
# - main'e web/ ya da bu dosyada değişiklik gelince (yönetim panelinden kaydedilen blog yazıları da main'e commit'tir);
# - her gün 06:00 UTC'de: zamanlanmış blog yazıları tarihleri geldiğinde yayımlansın (derleme, tarihi derleme gününden
#   sonra olan ve taslak yazıları atlar; web/src/lib/blog.ts → isBlogPostPublic);
# - elle (workflow_dispatch).
# Derleme elle yayınla aynıdır (`npm run build`, üretim yapılandırması). Gizli değerler: CLOUDFLARE_API_TOKEN (yalnızca
# "Cloudflare Pages: Edit" yetkili API jetonu) ve CLOUDFLARE_ACCOUNT_ID (bkz. web/README.md).
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# İş yalnızca kodu okur; yayın Cloudflare jetonuyla yapılır.
permissions:
  contents: read

# Yayınlar üst üste binmez: süren yayın biter, bekleyen en yenisi ardından çalışır.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bağımlılıklar
        run: npm ci
      - name: Derleme
        run: npm run build
      # Wrangler sürümü sunucununkiyle (server/package.json) aynı tutulur: yayın aracı sessizce değişmez.
      - name: Cloudflare Pages'e yükle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.154.0 pages deploy dist --project-name ainotepad --branch main
