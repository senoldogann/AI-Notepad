# Her PR'da ve main'e her gönderimde: hızlı testler (macOS), Mac uygulaması ve iPhone uygulaması (simülatör) derlemesi.
# İmza yok (CODE_SIGNING_ALLOWED=NO); gerçek bulut ve model testleri yerelde ortam değişkenleriyle çalışır.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# İş yalnızca kodu okur; GITHUB_TOKEN'ın başka yetkisi yok.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Araç sürümleri
        run: |
          xcodebuild -version
          swift --version
      - name: Hızlı testler (macOS)
        run: swift test --package-path Packages/AINotepadCore
      - name: Projeyi üret
        # XcodeGen sürümü sabit: Homebrew başka sürüm kurarsa üretilen proje sessizce değişmesin, iş dursun.
        env:
          XCODEGEN_VERSION: "2.45.3"
        run: |
          brew install xcodegen
          installed="$(xcodegen --version | sed -E 's/^Version: //')"
          if [ "$installed" != "$XCODEGEN_VERSION" ]; then
            echo "XcodeGen $installed kuruldu, $XCODEGEN_VERSION bekleniyordu; ci.yml'deki sürümü güncelle." >&2
            exit 1
          fi
          xcodegen generate
      - name: Mac uygulaması
        run: >
          xcodebuild -project AINotepad.xcodeproj -scheme AINotepad -configuration Debug
          -derivedDataPath .build/xcode -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO build -quiet
      - name: iPhone uygulaması (simülatör)
        run: >
          xcodebuild -project AINotepad.xcodeproj -scheme AINotepadiOS -configuration Debug
          -derivedDataPath .build/xcode-ios -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build -quiet
