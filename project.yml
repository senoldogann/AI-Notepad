name: AINotepad
options:
  bundleIdPrefix: com.senoldogan
  # Kaynak metinler Türkçe; İngilizce çeviriler App/Localizable.xcstrings'te.
  developmentLanguage: tr
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.1"
packages:
  AINotepadCore:
    path: Packages/AINotepadCore
targets:
  AINotepad:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: AINotepadCore
        product: AINotepadCore
      - package: AINotepadCore
        product: AINotepadUI
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Gömülü Inter (App/Fonts; Resources köküne kopyalanır).
        ATSApplicationFontsPath: "."
        NSAudioCaptureUsageDescription: "AI-Notepad toplantıdaki diğer katılımcıların sesini yazıya dökmek için sistem sesini dinler."
        NSRemindersFullAccessUsageDescription: "AI-Notepad toplantı notundaki görevleri istediğinde Anımsatıcılar'a ekler."
        NSCalendarsFullAccessUsageDescription: "AI-Notepad yaklaşan toplantılarını gösterir, başlamadan önce hatırlatır ve notu toplantının adıyla kaydeder."
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senoldogan.AINotepad
        PRODUCT_NAME: AINotepad
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Yerelleştirilebilir metinler derlemede çıkarılır ve String Catalog'a eşlenir.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Apple noter onayı (notarization) hardened runtime ister; mikrofon yetkisi entitlements dosyasında.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/AINotepad.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: AI-Notepad
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AI-Notepad toplantıda söylediklerini yazıya dökmek için mikrofonu kullanır."
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "3"
  AINotepadiOS:
    type: application
    platform: iOS
    sources:
      - iOS
      # Ortak metin kataloğu ve gömülü Inter yazı tipi Mac uygulamasıyla paylaşılır.
      - path: App/Localizable.xcstrings
      - path: App/Fonts/InterVariable.ttf
        buildPhase: resources
    dependencies:
      - package: AINotepadCore
        product: AINotepadCore
      - package: AINotepadCore
        product: AINotepadUI
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senoldogan.AINotepad
        PRODUCT_NAME: AINotepad
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: AI-Notepad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AI-Notepad yüz yüze toplantıyı yazıya dökmek için mikrofonu kullanır."
        CODE_SIGN_ENTITLEMENTS: iOS/AINotepad.entitlements
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "3"
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Kayıt ekran kilitliyken ve uygulama arka plandayken sürer.
        UIBackgroundModes: [audio]
        UIAppFonts: [InterVariable.ttf]
